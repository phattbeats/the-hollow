# PHATT-RAID (Unraid) overrides for the Phase 0 self-host.
# Host port 5433 is taken by an existing postgresql17 container, so the
# game db keeps no host binding (the game reaches it on the compose network).
# The game binds 0.0.0.0:8787 for LAN play; a reverse proxy can front it later.
# Usage (remote daemon via the phatt-claw socket proxy):
#   DOCKER_HOST=tcp://phatt-claw:2375 docker compose -p the-hollow \
#     -f docker-compose.yml -f deploy/phatt-raid/docker-compose.raid.yml \
#     --env-file <secrets .env> up -d --build postgres game
services:
  postgres:
    ports: !reset []
  game:
    ports: !override
      - "8787:8787"
