# SWAG proxy conf for The Hollow on PHATT-RAID.
# Installed at <swag appdata>/nginx/proxy-confs/theplant.subdomain.conf
# (swag's stock proxy.conf carries the WebSocket Upgrade headers the game needs).
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name theplant.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 10M;

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app the-hollow-game;
        set $upstream_port 8787;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
