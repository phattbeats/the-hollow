# PHATT-RAID deployment override. Used together with the base compose file:
#
#   docker compose -p the-hollow \
#     -f docker-compose.yml -f deploy/phatt-raid/compose.phatt-raid.yml \
#     up -d --build postgres game
#
# Differences from the generic self-host path (DEPLOY.md):
# - No published host ports: the SWAG reverse proxy (existing infra, on the
#   `phattvip` docker network) is the only public entrance, terminating TLS
#   for https://theplant.phatt.vip via deploy/phatt-raid/theplant.subdomain.conf.
# - Containers carry the phattclaw.managed label so the studio's socket proxy
#   may start/stop/restart them.
services:
  postgres:
    container_name: the-hollow-db
    labels:
      phattclaw.managed: "true"
    ports: !reset []

  game:
    container_name: the-hollow-game
    labels:
      phattclaw.managed: "true"
    ports: !reset []
    networks:
      default: null
      phattvip: null

networks:
  phattvip:
    external: true
