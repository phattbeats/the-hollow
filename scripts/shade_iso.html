<!doctype html>
<!-- PHAA-636 (Sable): isolation render of npc_shade through the PRODUCTION character
     pipeline (preloadVisual + CharacterVisual = prepareVisual/assembleModel/applyMaterials),
     no full-world boot. Served off the live vite origin so the GLB/textures fetch and
     localStorage (gfx tier) resolve. Skips the 216-asset world load that stalls Browserless. -->
<html lang="en">
<head><meta charset="utf-8"><style>html,body{margin:0;background:#8a8f98;overflow:hidden}</style></head>
<body>
<script type="module">
import * as THREE from 'three';
import { preloadVisual } from '/src/render/characters/assets.ts';
import { CharacterVisual } from '/src/render/characters/visual.ts';

const W = 820, H = 980;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8a8f98);

// game-like lighting: sky hemi + warm key (shadowed) + cool fill
const hemi = new THREE.HemisphereLight(0xdfe7ff, 0x40382e, 0.9); scene.add(hemi);
const key = new THREE.DirectionalLight(0xfff2e0, 1.5);
key.position.set(3, 6, 4); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5; key.shadow.camera.far = 30;
key.shadow.camera.left = -4; key.shadow.camera.right = 4;
key.shadow.camera.top = 5; key.shadow.camera.bottom = -1;
key.shadow.bias = -0.0004; scene.add(key);
const fill = new THREE.DirectionalLight(0xbcd0ff, 0.5); fill.position.set(-4, 3, -2); scene.add(fill);

const camera = new THREE.PerspectiveCamera(35, W / H, 0.1, 100);

const IDLE = { speed: 0, moving: false, airborne: false, backwards: false, dead: false, casting: false, swimming: false, sitting: false };
const WALK = { speed: 2.2, moving: true, airborne: false, backwards: false, dead: false, casting: false, swimming: false, sitting: false };

let visual = null;
function render() { renderer.render(scene, camera); }

async function main() {
  await preloadVisual('npc_shade');
  visual = new CharacterVisual('npc_shade', 0xffffff);
  for (let i = 0; i < 40; i++) visual.update(1 / 20, IDLE, true); // settle idle
  visual.root.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  scene.add(visual.root);

  // ground under feet
  const box = new THREE.Box3().setFromObject(visual.root);
  const gmesh = new THREE.Mesh(new THREE.CircleGeometry(6, 48),
    new THREE.MeshStandardMaterial({ color: 0x6f757f }));
  gmesh.rotation.x = -Math.PI / 2; gmesh.position.y = box.min.y; gmesh.receiveShadow = true;
  scene.add(gmesh);

  window.__shade = {
    THREE, scene, camera, visual, render,
    feetY: box.min.y, headY: box.max.y, height: box.max.y - box.min.y,
    tickIdle: (n) => { for (let i = 0; i < n; i++) visual.update(1 / 20, IDLE, true); render(); },
    tickWalk: (n) => { for (let i = 0; i < n; i++) visual.update(1 / 20, WALK, true); render(); },
    // aim: place camera at (cx,cy,cz) looking at (tx,ty,tz)
    cam: (cx, cy, cz, tx, ty, tz) => { camera.position.set(cx, cy, cz); camera.lookAt(tx, ty, tz); render(); },
  };
  render();
  window.__shotReady = true;
}
main().catch((e) => { window.__shotErr = String(e?.stack || e); });
</script>
</body>
</html>
